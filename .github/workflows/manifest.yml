# Gera o manifest.json que o Posit Connect Cloud exige para apps R
# (lista exata de pacotes e versões) e faz commit dele na main.
# Roda sozinho quando o código do app muda, ou em Actions > Gerar manifest > Run workflow.
name: Gerar manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app.R", "R/**", ".github/workflows/manifest.yml"]

concurrency:
  group: manifest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::DT
            any::DBI
            any::RSQLite
            any::xml2
            any::stringi
            any::rsconnect

      - name: Escrever manifest.json
        run: |
          Rscript -e '
            arquivos <- c("app.R", list.files("R", pattern = "\\.R$", full.names = TRUE))
            arquivos <- setdiff(arquivos, c("R/testar_artigo_y.R", "R/testar_lattes.R"))
            rsconnect::writeManifest(appDir = ".", appFiles = arquivos)
          '
          python3 .github/corrigir_manifest.py
          head -c 400 manifest.json

      - name: Commit do manifest.json
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json >/dev/null 2>&1; then
            echo "manifest.json sem mudanças"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Atualiza manifest.json (Posit Connect Cloud)"
          git push
